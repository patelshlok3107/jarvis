name: Android Release
on:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties && cat local.properties
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Grant Gradlew
        run: chmod +x ./gradlew || true
      - name: Build APK
        id: build
        run: |
          echo "=== Build start ==="
          ls -la gradle/wrapper/ 2>&1 | head -n 20 || true
          cat gradle/wrapper/gradle-wrapper.properties 2>&1 | head -n 20 || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
          ls -la $ANDROID_HOME/platforms 2>&1 | head -n 20 || true
          # Ensure platform 34 installed
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
          fi
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating wrapper..."
            gradle wrapper --gradle-version 8.7 || true
            ls -lh gradle/wrapper/ || true
          fi
          chmod +x ./gradlew || true
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log; echo "exit:$?" | tee -a build.log
          ls -lh build.log || true
          cat build.log | tail -n 80 || true
          ls -R app/build 2>&1 | head -n 100 || true
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then echo "APK NOT FOUND"; exit 1; fi
      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK" || ls -R app/build/outputs/apk 2>&1 | head -n 50 || true
          echo "APK=$APK"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Show build log on failure
        if: failure()
        run: |
          echo "=== BUILD LOG TAIL ==="
          cat build.log 2>&1 | tail -n 150 || true
          echo "=== END BUILD LOG ==="

      - name: Commit build log for debugging
        if: failure()
        run: |
          git config user.email "bot@jarvis.local"
          git config user.name "Jarvis Bot"
          cp build.log build-error.log || echo "no log"
          git add build-error.log || true
          git commit -m "ci: add build error log [skip ci]" || true
          git push || true
      - name: Rename APK
        run: |
          APK="${{ steps.apk.outputs.apk }}"
          VERSION="1.0.0"
          if [ -n "${{ inputs.version }}" ]; then VERSION="${{ inputs.version }}"; fi
          if grep -q "versionName" app/build.gradle.kts; then V=$(grep versionName app/build.gradle.kts | sed -E 's/.*\"([^\"]+)\".*/\1/'); if [ -n "$V" ]; then VERSION="$V"; fi; fi
          cp "$APK" "JARVIS-v${VERSION}.apk"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          ls -lh JARVIS-v*.apk
      - name: Verify APK
        run: |
          APK="JARVIS-v${{ env.VERSION }}.apk"
          if [ ! -f "$APK" ]; then echo "APK missing"; exit 1; fi
          if command -v apksigner >/dev/null 2>&1; then apksigner verify --print-certs "$APK" || echo "verify warning"; fi
          if command -v aapt >/dev/null 2>&1; then aapt dump badging "$APK" | head -n 20; fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: JARVIS v${{ env.VERSION }}
          body: |
            JARVIS — Shlok's AI Assistant v${{ env.VERSION }}

            Native Android APK with real Telecom integration.

            Install via Vercel → INSTALL JARVIS or download directly.

            - Package: com.shlok.jarvis
            - Min SDK: 26 (Android 8.0)
            - Telecom: CallScreeningService + ConnectionService/InCallService
          files: JARVIS-v${{ env.VERSION }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
