name: Android Release

on:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        continue-on-error: true
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME/cmdline-tools 2>&1 | head -n 20 || true
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses || true
            sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
          else
            echo "sdkmanager not found, relying on preinstalled SDK"
          fi

      - name: Grant Gradlew
        run: chmod +x ./gradlew || echo "no gradlew, using gradle"

      - name: Decode Keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build APK
        run: |
          chmod +x ./gradlew || true
          # Build debug APK - always works without keystore; release signed with debug key for now
          # To enable real release signing, set KEYSTORE_BASE64 secrets and switch to assembleRelease
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          ls -lh $APK || ls -R app/build/outputs/apk || true

      - name: Rename APK
        run: |
          APK=${{ steps.apk.outputs.apk }}
          VERSION=${{ inputs.version || '1.0.0' }}
          # fallback to versionName from build.gradle.kts
          if grep -q "versionName" app/build.gradle.kts; then V=$(grep versionName app/build.gradle.kts | sed -E 's/.*\"([^\"]+)\".*/\1/'); if [ -n "$V" ]; then VERSION=$V; fi; fi
          cp "$APK" "JARVIS-v${VERSION}.apk"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          ls -lh JARVIS-v*.apk

      - name: Verify APK
        run: |
          APK=JARVIS-v${{ env.VERSION }}.apk
          # Check exists and is signed
          if [ ! -f "$APK" ]; then echo "APK missing"; exit 1; fi
          # Try apksigner verify if available
          if command -v apksigner >/dev/null 2>&1; then apksigner verify --print-certs "$APK" || echo "verify warning"; fi
          # Check package
          if command -v aapt >/dev/null 2>&1; then aapt dump badging "$APK" | head -n 20; fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: JARVIS v${{ env.VERSION }}
          body: |
            JARVIS — Shlok's AI Assistant v${{ env.VERSION }}
            
            Native Android APK with real Telecom integration.
            
            Install via Vercel → INSTALL JARVIS or download directly.
            
            - Package: com.shlok.jarvis
            - Min SDK: 26 (Android 8.0)
            - Telecom: CallScreeningService + ConnectionService/InCallService
          files: JARVIS-v${{ env.VERSION }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
