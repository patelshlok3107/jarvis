name: Android Release

on:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Grant Gradlew
        run: chmod +x ./gradlew || echo "no gradlew, using gradle"

      - name: Decode Keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore || true

      - name: Diagnose
        run: |
          echo "PWD=$(pwd)"
          ls -la
          cat local.properties || true
          ls -la app/build.gradle.kts || true
          java -version
          gradle --version || true
          ./gradlew --version 2>&1 | head -n 20 || true
          ls -la $ANDROID_HOME/platforms 2>&1 | head -n 20 || true

      - name: Build APK
        run: |
          chmod +x ./gradlew || true
          set -o pipefail
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log
          else
            gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log
          fi
          echo "Build exit: $?"

      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          ls -lh $APK || ls -R app/build/outputs/apk || true

      - name: Rename APK
        run: |
          APK=${{ steps.apk.outputs.apk }}
          VERSION=${{ inputs.version || '1.0.0' }}
          # fallback to versionName from build.gradle.kts
          if grep -q "versionName" app/build.gradle.kts; then V=$(grep versionName app/build.gradle.kts | sed -E 's/.*\"([^\"]+)\".*/\1/'); if [ -n "$V" ]; then VERSION=$V; fi; fi
          cp "$APK" "JARVIS-v${VERSION}.apk"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          ls -lh JARVIS-v*.apk

      - name: Verify APK
        run: |
          APK=JARVIS-v${{ env.VERSION }}.apk
          # Check exists and is signed
          if [ ! -f "$APK" ]; then echo "APK missing"; exit 1; fi
          # Try apksigner verify if available
          if command -v apksigner >/dev/null 2>&1; then apksigner verify --print-certs "$APK" || echo "verify warning"; fi
          # Check package
          if command -v aapt >/dev/null 2>&1; then aapt dump badging "$APK" | head -n 20; fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: JARVIS v${{ env.VERSION }}
          body: |
            JARVIS — Shlok's AI Assistant v${{ env.VERSION }}
            
            Native Android APK with real Telecom integration.
            
            Install via Vercel → INSTALL JARVIS or download directly.
            
            - Package: com.shlok.jarvis
            - Min SDK: 26 (Android 8.0)
            - Telecom: CallScreeningService + ConnectionService/InCallService
          files: JARVIS-v${{ env.VERSION }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
